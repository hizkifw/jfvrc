services:
  jfvrc:
    build: .
    image: jfvrc:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - jfvrc-data:/data
    # JFVRC does not need host networking; point JELLYFIN_URL at a reachable
    # Jellyfin host (for example the service name or host IP).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  jfvrc-data:
